# Render Blueprint — deploy with one click after connecting the repo.
# https://render.com  →  New +  →  Blueprint  →  pick this repo.
services:
  - type: web
    name: devrush-arena
    runtime: node
    plan: starter            # $7/mo: no cold starts, supports a persistent disk
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true         # tip: turn OFF during a live event so a push can't restart mid-game
    healthCheckPath: /api/time
    envVars:
      - key: DATA_DIR        # persist the store on the mounted disk below
        value: /data
      - key: HOST_CODE       # set your own secret in the dashboard (Environment tab)
        sync: false
    disk:
      name: data
      mountPath: /data       # game state (data.json) lives here, survives restarts
      sizeGB: 1
