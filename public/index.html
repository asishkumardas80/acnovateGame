<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevRush Arena</title>
<style>
  :root{
    --bg:#eef1f8; --bg2:#f6f8fd; --panel:#ffffff; --panel2:#eef2fb;
    --ink:#1b2340; --muted:#5f6b90; --line:#e2e7f3;
    --accent:#4f7cf0; --accent2:#7c5bff; --green:#1eb866; --red:#f0426b;
    --gold:#f4b400; --silver:#b9c2d8; --bronze:#c98a4e;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font:15px/1.5 system-ui,Segoe UI,Roboto,Arial,sans-serif;
    min-height:100vh;background-color:#eaeefb;background-attachment:fixed;
    background-image:
      radial-gradient(rgba(40,55,110,.055) 1px, transparent 1.6px),
      linear-gradient(180deg,#eef1fb 0%,#e7ecfa 100%);
    background-size:22px 22px, 100% 100%}
  /* animated "aurora" colour layer behind the (opaque white) cards */
  #bg{position:fixed;inset:-18%;z-index:-1;pointer-events:none;will-change:transform;
    background:
      radial-gradient(38% 40% at 18% 22%, rgba(124,91,255,.42), transparent 68%),
      radial-gradient(36% 40% at 82% 16%, rgba(79,124,240,.40), transparent 68%),
      radial-gradient(40% 42% at 82% 82%, rgba(47,212,201,.34), transparent 68%),
      radial-gradient(40% 42% at 15% 84%, rgba(240,66,107,.32), transparent 68%),
      radial-gradient(34% 36% at 52% 52%, rgba(255,180,0,.24), transparent 70%);
    animation:aurora 26s ease-in-out infinite alternate}
  @keyframes aurora{
    0%{transform:translate3d(-1.5%,-1%,0) scale(1) rotate(0deg)}
    100%{transform:translate3d(2%,1.5%,0) scale(1.08) rotate(1.5deg)}}
  @media(prefers-reduced-motion:reduce){#bg{animation:none}}
  h1,h2,h3{margin:0 0 .4em}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;
    background:var(--accent);color:#fff;font-weight:600;transition:transform .06s,filter .15s}
  button:hover{filter:brightness(1.08)} button:active{transform:translateY(1px)}
  button.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  button.warn{background:var(--red)} button.ok{background:var(--green);color:#04210f}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,textarea,select{font:inherit;color:var(--ink);background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  textarea{resize:vertical;min-height:90px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  .muted{color:var(--muted)}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;
    background:var(--panel2);border:1px solid var(--line)}
  .pill.live{background:rgba(30,184,102,.16);color:#0f8a48;border-color:rgba(30,184,102,.4)}
  .pill.lobby{background:rgba(124,91,255,.15);color:#6a45e6;border-color:rgba(124,91,255,.4)}
  .pill.reveal{background:rgba(244,180,0,.18);color:#b07a00;border-color:rgba(244,180,0,.45)}
  .big{font-size:clamp(28px,6vw,54px);font-weight:800;letter-spacing:.5px}
  #sword.solved{color:var(--green)}
  /* live participant counter */
  .counter{display:flex;flex-direction:column;align-items:center;line-height:1;
    background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 16px;min-width:74px}
  .counter .cnum{font-size:34px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
  .counter .clbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:2px}
  /* foundation-day banner */
  .banner-wrap{max-width:440px;margin:0 auto;text-align:center}
  .banner{width:100%;height:auto;display:block;border-radius:14px;
    box-shadow:0 8px 22px rgba(20,40,90,.12);border:1px solid var(--line)}
  .fday{font-size:clamp(18px,4vw,30px);font-weight:900;letter-spacing:.3px;
    background:linear-gradient(90deg,#7c5bff,#ff5470,#ff8f3b,#37d67a);-webkit-background-clip:text;
    background-clip:text;color:transparent;text-align:center;padding:4px 0}
  .timer{font-variant-numeric:tabular-nums;font-weight:800}
  .timer.low{color:var(--red)}
  .hidden{display:none!important}
  .grid2{display:grid;grid-template-columns:1fr 320px;gap:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .lead{list-style:none;margin:0;padding:0}
  .lead li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:var(--bg2)}
  .lead .rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--panel2)}
  .lead .rank.g1{background:var(--gold);color:#3a2b00}
  .lead .rank.g2{background:var(--silver);color:#26304a}
  .lead .rank.g3{background:var(--bronze);color:#331c07}
  .lead .sc{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
  .brand{font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--green));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .center{text-align:center}
  .opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .opt.sel{outline:2px solid var(--accent);background:var(--panel)}
  .opt.correct{background:rgba(55,214,122,.2);border-color:var(--green)}
  /* Bollywood Hangama */
  .mqemoji{font-size:44px;text-align:center;margin:8px 0 4px}
  .mqclues{margin:6px 0 12px;padding-left:20px;font-size:14px;line-height:1.65;color:var(--ink)}
  .mqclues li{margin:3px 0}
  .opt.wrong{background:rgba(255,84,112,.18);border-color:var(--red)}
  pre.code{background:#0a0f22;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;
    font:13px/1.55 ui-monospace,Consolas,monospace;color:#d6e0ff}
  pre.code .blank{background:rgba(255,210,87,.22);color:#ffd257;border:1px dashed #ffd257;border-radius:5px;padding:0 6px}
  code{background:#0a0f22;color:#d6e0ff;border-radius:5px;padding:1px 6px;
    font-family:ui-monospace,Consolas,monospace;font-size:.9em}
  .maze{display:grid;gap:0;background:#0a0f22;border-radius:10px;padding:8px;width:max-content;
    max-width:100%;margin:0 auto;overflow:auto}
  .mcell{width:20px;height:20px}
  .mcell.w{background:#33407a}
  .mcell.p{background:transparent}
  .mcell.fog{background:#151b30}
  .mcell.s{background:var(--green);border-radius:4px}
  .mcell.e{background:var(--red);border-radius:4px;box-shadow:0 0 8px var(--red)}
  .mcell.elock{background:#7a2233;border-radius:4px}
  .mcell.coin{background:var(--gold);border-radius:50%;box-shadow:0 0 8px var(--gold)}
  .mcell.you{background:#fff;border-radius:50%;box-shadow:0 0 10px var(--accent);outline:2px solid var(--accent)}
  .dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px;margin:14px auto;width:max-content}
  .dpad button{width:54px;height:54px;padding:0;font-size:20px}
  .tiles{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center;margin:16px 0}
  .tile{height:84px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .tile.on{background:var(--accent);box-shadow:0 0 20px var(--accent)}
  /* Memory Matrix — colourful tiles */
  .mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    width:min(300px,80vw,44vh);margin:12px auto}
  .mtile{aspect-ratio:1;border-radius:18px;cursor:pointer;
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);filter:brightness(.72) saturate(.85);
    transition:transform .09s ease,filter .12s ease,box-shadow .14s ease}
  .mtile:active{transform:scale(.95)}
  .mtile.on{filter:brightness(1.4) saturate(1.25);transform:scale(1.05);
    box-shadow:0 0 28px 5px currentColor, inset 0 -5px 0 rgba(0,0,0,.12)}
  .mtiles.watch .mtile{cursor:not-allowed}
  .mtiles.watch{opacity:.96}
  .reactbox{height:220px;border-radius:14px;display:grid;place-items:center;font-size:22px;font-weight:800;cursor:pointer;user-select:none}
  .qbtns{display:flex;gap:6px;flex-wrap:wrap}
  .qbtns button{padding:6px 10px;font-size:13px}
  .howto{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    display:flex;flex-direction:column;gap:10px}
  .howto .hrow{display:flex;gap:10px;align-items:flex-start}
  .howto .hicon{font-size:20px;line-height:1.2;flex:0 0 auto}
  .howto .hlbl{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .ptsbadge{font-weight:800;color:var(--accent);background:rgba(79,124,240,.12);
    border:1px solid rgba(79,124,240,.32);border-radius:999px;padding:3px 12px;font-size:14px;
    display:inline-block;font-variant-numeric:tabular-nums}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  .pulse{animation:pop .35s}
  .copytarget{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    font-size:16px;line-height:1.9;margin-bottom:10px;user-select:none;max-height:230px;overflow:auto}
  .copytarget span.ok{color:var(--green);background:rgba(30,184,102,.12);border-radius:3px}
  #cp{min-height:130px}
  .cbclue{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .cbclue ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:10px}
  .cbclue li{font-size:15px}
  .cbdig{font-family:ui-monospace,Consolas,monospace;font-size:22px;color:var(--accent);
    background:rgba(79,124,240,.12);border-radius:6px;padding:0 8px}
  /* shared team vault */
  .cbvault{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .cbslot{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
  .cbslot .cbd{display:flex;align-items:center;justify-content:center;width:52px;height:60px;
    font-size:28px;font-weight:900;font-family:ui-monospace,Consolas,monospace;
    border:2px dashed var(--line);border-radius:12px;background:var(--panel2);color:var(--muted)}
  .cbslot .cbn{font-size:11px;color:var(--muted);text-align:center;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cbslot.ok .cbd{border-style:solid;border-color:var(--green);background:rgba(30,184,102,.14);color:var(--green)}
  .cbslot.bad .cbd{border-style:solid;border-color:var(--red);background:rgba(240,66,107,.12);color:var(--red)}
  /* Logo Guess (letter-tile) */
  .lgstage{background:#fff;border-radius:14px;padding:18px;min-height:200px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;border:1px solid var(--line)}
  .lgstage img{max-height:150px;max-width:80%;object-fit:contain}
  .lgmiss{color:#888;font-size:13px;text-align:center}
  .lgq{color:#334;font-weight:600}
  .lgslots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .lgslot{width:42px;height:46px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;
    font-size:22px;font-weight:800;background:var(--bg2)}
  .lgslot.filled{border-color:var(--accent)}
  .lgslots.ok .lgslot{border-color:var(--green);color:var(--green)}
  .lgslots.shake{animation:shakex .4s}
  @keyframes shakex{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .lgbank{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:440px;margin:0 auto}
  .lgtile{height:50px;font-size:18px;font-weight:800;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:0}
  .lgtile:disabled{opacity:.22}
  .lgtile.lgback{background:var(--bg2)}
  .emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .emcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .emcard.solved{border-color:var(--green);background:rgba(30,184,102,.1)}
  .ememoji{font-size:30px;letter-spacing:4px;margin-bottom:8px}
  .emok{font-weight:800;color:var(--green)}
  .bslist{display:flex;flex-wrap:wrap;gap:8px;max-height:220px;overflow:auto}
  .bschip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
  .testfails{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
  .testfails code{background:#0a0f22;color:#d6e0ff;border-radius:5px;padding:1px 6px;
    font-family:ui-monospace,Consolas,monospace}
  .testfails b{color:var(--red)}
  .logogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
  .logocard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .logocard img{width:100%;height:110px;object-fit:contain;background:#fff;border-radius:8px;padding:6px}
  .logocard input{margin-top:8px}
  .logoadmin img{height:44px;width:64px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
  .logoadmin li{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:6px 10px;margin-bottom:6px}
  /* avatars + people + teams */
  .avatar{display:inline-grid;place-items:center;border-radius:50%;font-size:20px;flex:0 0 auto;
    width:40px;height:40px;background:var(--accent);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
  .avatar.sm{width:30px;height:30px;font-size:15px}
  .avatar.lg{width:64px;height:64px;font-size:32px}
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
  .person{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);
    border-radius:12px;padding:8px 10px;position:relative}
  .person .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .person .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;padding:0;
    font-size:12px;line-height:1;background:var(--red);display:none}
  .person:hover .x{display:block}
  .apick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px;max-height:150px;overflow:auto}
  .apick button{font-size:22px;padding:6px;background:var(--bg2);border:1px solid var(--line)}
  .apick button.sel{outline:2px solid var(--accent);background:var(--panel)}
  .cpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .cpick .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .cpick .sw.sel{border-color:#fff}
  .teamcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .teamcard h3{display:flex;align-items:center;gap:8px}
  .dot{width:14px;height:14px;border-radius:50%;display:inline-block}
  .members{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .memchip{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px 4px 4px;font-size:13px}
  .chatlog{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
  .cmsg{display:flex;gap:8px;align-items:flex-start}
  .cmsg.me{flex-direction:row-reverse;text-align:right}
  .cmsg .cmeta{font-size:11px;color:var(--muted);margin-bottom:2px}
  .cmsg .ctext{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;
    font-size:13px;display:inline-block;max-width:210px;word-wrap:break-word;overflow-wrap:anywhere;text-align:left}
  .cmsg.me .ctext{background:rgba(79,124,240,.15);border-color:rgba(79,124,240,.35)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  .flash{animation:flash .6s}
  @keyframes flash{0%{background:rgba(55,214,122,.35)}100%{background:transparent}}
  .roundlist{display:flex;gap:6px;flex-wrap:wrap}
  .roundlist button{padding:6px 10px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
  /* team games get a teal left-edge, individual games a purple one */
  .roundlist button.tm{border-left:4px solid #12b3a6}
  .roundlist button.solo{border-left:4px solid #7c5bff}
  .roundlist button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
  /* game-type badge */
  .gk{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.4px;vertical-align:middle}
  .gk-team{background:rgba(18,179,166,.16);color:#0e8f86;border:1px solid rgba(18,179,166,.5)}
  .gk-solo{background:rgba(124,91,255,.14);color:#6a45e6;border:1px solid rgba(124,91,255,.4)}
  a.link{color:var(--accent)}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<canvas id="confetti"></canvas>
<div class="wrap" id="app"></div>

<script>
/* ============================================================================
   DevRush Arena
   People join with a name + avatar into a global lobby. The host builds random
   balanced teams (~6) and starts the game. Everyone then plays every mini-game
   on their own device; a team's round score is the AVERAGE of its members'
   points. Shared state lives in the server KV store.
   ============================================================================ */

// ---- Configuration ---------------------------------------------------------
// The host passcode is NOT here — it lives on the server (set HOST_CODE in the
// environment). The browser never sees it, so it can't be found by inspecting
// this page. The host enters it once and the server hands back a session token.
const TEAM_TARGET = 6;         // default people per team (host can change this in the lobby)
// The host's chosen team size (persists on the host's device). Falls back to TEAM_TARGET.
let teamTarget = Number(localStorage.getItem('dra_tsize')) || TEAM_TARGET;

const AVATARS = ['🦊','🚀','🐉','🦄','🐼','🦁','🐯','🐸','🐙','🦉','🐺','🐝','🦈','🐢',
  '🦕','🐧','🦖','🐬','🦩','🐨','🦥','🐳','🦇','🐌','🦋','🐰','🐷','🐵','🦓','🦒','🐲','🦅',
  '🌟','⚡','🔥','🍕','🍩','🎸','🎮','🏆'];
const COLORS = ['#5b8cff','#7c5bff','#37d67a','#ffd257','#ff5470','#ff8f3b','#2fd4c9',
  '#e05be0','#8bd450','#ff6b9d'];

const TEAM_POOL = [
  {name:'Red Rockets',   color:'#ff5470'},
  {name:'Blue Bolts',    color:'#5b8cff'},
  {name:'Green Goblins', color:'#37d67a'},
  {name:'Gold Griffins', color:'#ffd257'},
  {name:'Purple Pythons',color:'#7c5bff'},
  {name:'Orange Owls',   color:'#ff8f3b'},
  {name:'Cyan Cyborgs',  color:'#2fd4c9'},
  {name:'Pink Panthers', color:'#ff6b9d'},
  {name:'Teal Titans',   color:'#12b3a6'},
  {name:'Lime Lions',    color:'#8bd450'},
  {name:'Crimson Comets',color:'#e0466b'},
  {name:'Indigo Ninjas', color:'#6366f1'}
];

// ---- The 13 rounds ---------------------------------------------------------
const ROUNDS = [
  { id:'r1', type:'copy', title:'Copy the Paragraph', duration:180, max:100,
    prompt:'Copy the paragraph below. You have 3 minutes — your score is how many words match the original. No pasting!',
    texts:[
      'Developers are the people who turn ideas into technology that makes our lives easier. From mobile applications and websites to artificial intelligence and cloud platforms, developers play an important role in shaping the digital world. Being a developer is not only about writing code; it is also about solving problems, learning continuously, and creating useful solutions. Technology changes rapidly, so developers must always be ready to learn new tools and adapt to new challenges. At the same time, they must consider security, privacy, and the impact their software can have on people. A good developer does not simply ask, “Can we build it?” but also asks, “Should we build it, and how can we build it better?” In the future, developers will continue to turn imagination into reality.'
    ] },

  { id:'r2', type:'maze', title:'Maze Runner', duration:120, max:100, cols:10, rows:7,
    prompt:'Explore the fog! Collect ALL the gold coins, then reach the RED exit to clear the level — each level gets bigger. Arrow keys or the on-screen pad. More coins + levels = more points.' },

  { id:'r3', type:'javafill', title:'Java Code Sprint', duration:180, max:100,
    prompt:'This Java method should return the sum of the POSITIVE even numbers only — ignore negatives and zero. Fill in the missing if-condition!',
    functionName:'sumEven',
    code:'public static int sumEven(int[] arr) {\n    int sum = 0;\n    for (int num : arr) {\n        if ( /* ??? */ ) {\n            sum += num;\n        }\n    }\n    return sum;\n}',
    // The typed Java condition is dropped into this JS harness (arithmetic/boolean
    // expressions are identical in Java and JS) and run against the test cases.
    jsBefore:'function sumEven(arr){let sum=0;for(const num of arr){if(',
    jsAfter:'){sum+=num;}}return sum;}',
    tests:[

// ---- Seeded RNG + maze generator -------------------------------------------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genMaze(cols,rows,seed){
  const rnd=mulberry32(seed),W=cols*2+1,H=rows*2+1;
  const g=Array.from({length:H},()=>Array(W).fill(1));
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function carve(cx,cy){g[cy*2+1][cx*2+1]=0;
    for(const [dx,dy] of shuffle([[0,-1],[1,0],[0,1],[-1,0]])){
      const nx=cx+dx,ny=cy+dy;
      if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&g[ny*2+1][nx*2+1]===1){
        g[cy*2+1+dy][cx*2+1+dx]=0;carve(nx,ny);}}}
  carve(0,0);
  return {grid:g,start:[1,1],end:[H-2,W-2]};
}

// Count a brainstorm team's accepted (unique) answers from the shared list.
function bsEntries(teamId,r){ const pre='bs:'+r+':'+teamId+':';
  return Object.keys(STORE).filter(k=>k.startsWith(pre)).map(k=>STORE[k]).filter(Boolean)
    .sort((a,b)=>(a.ts||0)-(b.ts||0)); }
function bsAccepted(round,teamId,r){ const acc=new Set((round.accept||[]).map(norm));
  return bsEntries(teamId,r).filter(e=>acc.has(norm(e.text))).length; }

function teamRoundScore(t,r){
  const ov=STORE['tscore:'+r+':'+t.id]; if(typeof ov==='number') return ov;   // host override wins
  const round=ROUNDS[r];
  // Collaborative games are scored at TEAM level (derived from shared answers).
  if(round && round.type==='brainstorm'){
    const n=bsAccepted(round,t.id,r);
    return Math.min(round.max||100, Math.round(n/(round.target||10)*(round.max||100)));
  }
  if(round && round.type==='codebreak'){
    const cb=STORE['cb:'+r+':'+t.id]; if(cb&&cb.solved) return cb.score;   // full unlock + time bonus
    const {N}=cbAssign(round,t);                                            // else partial credit
    return N?Math.round(cbCorrectCount(t,r)/N*60):0;
  }
  if(round && round.type==='relay'){
    const qs=round.questions||[]; let correct=0;
    for(let i=0;i<qs.length;i++){ const a=STORE['rq:'+r+':'+t.id+':'+i]; if(a&&a.choice===qs[i].answerIndex) correct++; }
    return qs.length?Math.round(correct/qs.length*(round.max||100)):0;
  }
  if(round && round.type==='emoji'){
    const pz=round.puzzles||[]; let correct=0;
    for(let i=0;i<pz.length;i++){ const a=STORE['em:'+r+':'+t.id+':'+i];
      if(a && (pz[i].accept||[]).map(norm).includes(norm(a.text))) correct++; }
    return pz.length?Math.round(correct/pz.length*(round.max||100)):0;
  }
  if(round && round.type==='logoguess'){
    const total=(round.logos||[]).length;
    return total?Math.round(logoSolvedCount(round,t.id,r)/total*(round.max||100)):0;
  }
  // Individual games: team score = average of members' points.
  const m=teamMembers(t); if(!m.length) return 0;
  let s=0; m.forEach(p=>{const v=STORE['pscore:'+r+':'+p.pid]; if(typeof v==='number') s+=v;});
  return Math.round(s/m.length);
}
function teamTotal(t){ let s=0; for(let i=0;i<ROUNDS.length;i++) s+=teamRoundScore(t,i); return s; }
function teamLeaderboard(){
  return teamsMeta().map(t=>({t,score:teamTotal(t)}))
    .sort((a,b)=>b.score-a.score||a.t.name.localeCompare(b.t.name));
}

// ============================================================================
//  REAL-TIME CONNECTION (WebSocket)
// ============================================================================
// One live socket per client. The server pushes the whole store on every change,
// so the UI is always in sync, and it knows exactly who is connected — closing a
// tab drops the socket and the player is removed at once (no polling, no ghosts).
let ws=null, wsOutbox=[], wsRetry=0, wsClosedByUs=false;
function wsUrl(){ return (location.protocol==='https:'?'wss://':'ws://')+location.host; }
function wsSend(msg){
  const s=JSON.stringify(msg);
  if(ws && ws.readyState===1) ws.send(s); else wsOutbox.push(s);   // queue until open
}
function wsHello(){
  if(ROLE==='host') wsSend({t:'hello',role:'host',token:htoken()});
  else if(ROLE==='player' && MY && MY.pid) wsSend({t:'hello',role:'player',pid:MY.pid,me:MY});
}
function applyStore(newStore){
  STORE = newStore||{};
  G = STORE.game || defaultGame();
  if(!(G.roundIndex>=0 && G.roundIndex<ROUNDS.length)) G.roundIndex=0;
  if(ROLE==='player') renderPlayer();
  else if(ROLE==='host') renderHost();
}
function connectWS(){
  wsClosedByUs=false;
  try{ ws = new WebSocket(wsUrl()); }catch(e){ setTimeout(connectWS,1000); return; }
  ws.onopen = ()=>{ wsRetry=0; wsHello(); const q=wsOutbox; wsOutbox=[]; q.forEach(s=>{ try{ws.send(s);}catch(e){} }); };
  ws.onmessage = (ev)=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.t==='store'){ applyStore(m.store); }
    else if(m.t==='kicked'){                 // host reset the event -> back to landing
      wsClosedByUs=true; try{ws.close();}catch(e){}
      localStorage.removeItem('dra_me'); localStorage.removeItem('dra_joined'); MY=null;
      routeLanding();
    }
    else if(m.t==='denied' && m.reason==='auth'){ // host token no longer valid
      localStorage.removeItem('dra_htoken'); localStorage.removeItem('dra_role');
      wsClosedByUs=true; try{ws.close();}catch(e){} routeHostGate();
    }
  };
  ws.onclose = ()=>{ if(wsClosedByUs) return; wsRetry=Math.min(wsRetry+1,6);
    setTimeout(connectWS, 400*wsRetry); };   // auto-reconnect with backoff
  ws.onerror = ()=>{ try{ws.close();}catch(e){} };
}
function disconnectWS(){ wsClosedByUs=true; if(ws){ try{ws.close();}catch(e){} } ws=null; }
// Back-compat shims for the old polling API used across the app.
function poll(){ if(!ws || ws.readyState>1) connectWS(); }
function startPolling(){ disconnectWS(); connectWS(); }

// ---- Timer -----------------------------------------------------------------
function remaining(){
  if(!G||G.phase!=='playing') return 0;
  return Math.max(0,Math.ceil((G.tStart+G.duration*1000-serverNow())/1000));
}
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
let lastTick=-1;
setInterval(()=>{
  const rem=remaining();
  document.querySelectorAll('.timer').forEach(el=>{
    el.textContent=fmt(rem); el.classList.toggle('low',rem<=10&&G&&G.phase==='playing');
  });
  if(G&&G.phase==='playing'){
    if(rem<=5&&rem>0&&rem!==lastTick) sndTick();
    if(rem===0&&lastTick!==0 && ROLE==='player' && activeGame && !activeGame.submitted){
      submitActiveGame(true);
    }
    lastTick=rem;
    if(ROLE==='player' && G.stage==='game' && ROUNDS[G.roundIndex]){
      const _t=ROUNDS[G.roundIndex].type;
      if(_t==='relay') relayTick(); else if(_t==='logoguess') logoTick();
    }
  }
},250);

function startPlayer(){ ROLE='player'; localStorage.setItem('dra_role','player'); lastKey=''; _committedStage=null; celebrated=myTeamTotal(); startPolling(); }

function renderPlayer(){
  // If the host wiped everything (Reset) AFTER we joined, bounce to the landing
  // page instead of silently re-registering as a ghost.
  const joined=Number(localStorage.getItem('dra_joined')||'0');
  if(G && G.resetAt && joined && G.resetAt>joined){
    disconnectWS(); lastKey='';
    localStorage.removeItem('dra_me'); localStorage.removeItem('dra_joined');
    MY=null; routeLanding(); return;
  }
  if(!STORE['player:'+MY.pid]){ // was reset/removed by host -> re-register
    apiSet('player:'+MY.pid,{...MY,ts:serverNow()});
  }
  const stage=stableStage(G.stage||'lobby');
  // Include my team in the key EXCEPT during active play, so a late-joiner's
  // assignment refreshes the header/ready screen without tearing down a live game.
  const teamKey = G.phase==='playing' ? '' : (':'+((teamOf(MY.pid)||{}).id||'none'));
  const key = stage==='game' ? ('game:'+G.phase+':'+G.roundIndex+teamKey) : 'lobby';
  if(key!==lastKey){
    lastKey=key;
    if(activeGame&&!activeGame.submitted) submitActiveGame(true);
    if(activeGame&&activeGame.cleanup) activeGame.cleanup();
    activeGame=null;
    if(stage==='game') buildPlayerGame(); else buildPlayerLobby();
  }
  // dynamic bits
  if(stage==='game'){
    const my=myTeamTotal();
    celebrated=my;   // (no confetti/sound on every score tick — it was distracting)
    const sc=$('#teamscore'); if(sc) sc.textContent=my;
    const t=teamOf(MY.pid);
    const lb=$('#lb'); if(lb){ lb.innerHTML=leaderboardHTML(t&&t.id); }
    const cl=$('#chatlog'); if(cl && t){ const atBottom=cl.scrollHeight-cl.scrollTop-cl.clientHeight<40;
      cl.innerHTML=chatHTML(t.id); if(atBottom) cl.scrollTop=cl.scrollHeight; }
    if(G.phase==='playing'){
      const rt=ROUNDS[G.roundIndex].type;
      if(rt==='brainstorm') refreshBrainstorm();
      else if(rt==='codebreak') refreshCodebreak();
      else if(rt==='relay') refreshRelay();
      else if(rt==='emoji') refreshEmoji();
      else if(rt==='logoguess') refreshLogoGuess();
      else refreshSubmitCount();
    }
  } else {
    refreshLobbyPlayer();
  }
}

// Shared "how to play + points + time" card, used on the player ready screen
// AND on the host console so the host can brief everyone.
// Which games the whole team plays together for ONE shared score, vs. games
// each person plays alone (team score = average). Single source of truth.
const TEAM_TYPES = ['codebreak','relay','logoguess','brainstorm','emoji'];
function isTeamGame(round){ return TEAM_TYPES.includes(round.type); }
function gameKindBadge(round){ return isTeamGame(round)
  ? '<span class="gk gk-team">👥 TEAM GAME</span>'
  : '<span class="gk gk-solo">🙋 INDIVIDUAL</span>'; }

function helpCardHTML(round){
  const h=GAME_HELP[round.id]||{how:round.prompt||'',pts:'Up to 100 points.'};
  const m=Math.floor(round.duration/60), s=round.duration%60;
  const time=(m?m+' min ':'')+(s?s+' sec':'');
  const team=isTeamGame(round);
  const teamNote = team
    ? 'the whole team plays together for <b>one shared team score</b>.'
    : "everyone plays on their own device — your team's score is the <b>average</b> of all members' points.";
  return `<div class="howto">
    <div class="hrow"><span class="hicon">${team?'👥':'🙋'}</span><div><div class="hlbl">Game type</div>
      <div>${gameKindBadge(round)} — ${team?'play as a team':'play individually'}</div></div></div>
    <div class="hrow"><span class="hicon">🎮</span><div><div class="hlbl">How to play</div>
      <div>${esc(h.how)}</div></div></div>
    ${h.ex?`<div class="hrow"><span class="hicon">📝</span><div><div class="hlbl">Example</div>
      <div>${esc(h.ex)}</div></div></div>`:''}
    <div class="hrow"><span class="hicon">⭐</span><div><div class="hlbl">Points</div>
      <div>${esc(h.pts)}</div></div></div>
    <div class="hrow"><span class="hicon">⏱️</span><div><div class="hlbl">Time</div>
      <div>${time} — ${teamNote}</div></div></div>
  </div>`;
}

function submitActiveGame(isTimeout){
  if(!activeGame||activeGame.submitted) return;
  activeGame.submitted=true;
  const res=activeGame.finalize(isTimeout)||{};
  postResult(res.score,res.display);
  const ga=$('#gamearea');
  if(ga){
    const done=document.createElement('div');done.style.marginTop='12px';

// Continuously bank the player's CURRENT score during an individual round, so a
// score still counts even if the final auto-submit never fires (phone locks, tab
// backgrounded, host reveals early). Writes pscore only (not panswer), so it does
// NOT lock the player out or mark them "done" — they can keep improving, and an
// explicit/time-up submit overwrites this with the final value.
let lastAutoScore=-1;
function autosaveProgress(){
  if(ROLE!=='player'||!MY||!G||G.phase!=='playing'||!activeGame||activeGame.submitted) return;
  const round=ROUNDS[G.roundIndex]; if(!round) return;
  if(['brainstorm','codebreak','relay','emoji','logoguess'].includes(round.type)) return; // team games are derived
  let res={}; try{ res=activeGame.finalize(false)||{}; }catch(e){ return; }
  if(typeof res.score!=='number' || res.score===lastAutoScore) return;
  lastAutoScore=res.score;
  apiSet('pscore:'+G.roundIndex+':'+MY.pid, res.score);
}
setInterval(autosaveProgress, 3000);
// Flush the current score the moment the tab is hidden or the page is closing
// (e.g. the phone screen locks) — the last chance to run JS before it freezes.
document.addEventListener('visibilitychange',()=>{ if(document.hidden) autosaveProgress(); });
window.addEventListener('pagehide', autosaveProgress);

function refreshSubmitCount(){
  const t=teamOf(MY.pid); if(!t) return;
  const m=teamMembers(t); const done=m.filter(p=>STORE['panswer:'+G.roundIndex+':'+p.pid]).length;
  const el=$('#subcount'); if(el) el.textContent=`${done}/${m.length} teammates done`;
}

function mountTeamGame(round){

  const already = !collaborative && STORE['panswer:'+G.roundIndex+':'+MY.pid];

function speedBonus(round){ const frac=round.duration? remaining()/round.duration : 0;
  return 60+Math.round(40*clamp(frac,0,1)); }

// 1) Copy the Paragraph — retype it; score = how many WORDS match the original
// (order-preserving longest common subsequence, so one typo doesn't cascade).
function lcsWordMatch(typed,target){
  // returns the set of target-word indices matched, in order
  const m=typed.length,n=target.length;
  const dp=Array.from({length:m+1},()=>new Int16Array(n+1));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]= typed[i-1]===target[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  const set=new Set(); let i=m,j=n;
  while(i>0&&j>0){
    if(typed[i-1]===target[j-1]){ set.add(j-1); i--; j--; }
    else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--;
  }
  return set;
}
function gameCopy(box,round){
  const pool=round.texts||['The quick brown fox jumps over the lazy dog.'];
  // Same paragraph for everyone this round (seeded by the shared start time).
  const target=pool[Math.floor(mulberry32((G.tStart||1)+7)()*pool.length)];
  const tWords=target.split(/\s+/).filter(Boolean);
  box.innerHTML=`
    <div class="copytarget" id="tgt"></div>
    <textarea id="cp" placeholder="Type the paragraph here…" spellcheck="false"
      autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    <div class="row" style="justify-content:space-between;margin-top:6px">
      <span class="muted" id="cst">0 / ${tWords.length} words matched</span>
      <span class="ptsbadge" id="cpts" data-v="0">⭐ 0 pts</span></div>`;
  const tgt=$('#tgt',box), ta=$('#cp',box), st=$('#cst',box), pb=$('#cpts',box);
  tgt.innerHTML=tWords.map((w,i)=>`<span data-i="${i}">${esc(w)}</span>`).join(' ');
  const spans=tgt.querySelectorAll('span');
  function matchedSet(){
    const typedW=ta.value.trim()?ta.value.trim().split(/\s+/):[];
    return lcsWordMatch(typedW,tWords);
  }
  function update(){
    const set=matchedSet();
    spans.forEach((s,i)=>{ s.className=set.has(i)?'ok':''; });
    st.textContent=`${set.size} / ${tWords.length} words matched`;
    const score=Math.round(set.size/tWords.length*100), old=+pb.dataset.v||0;
    pb.textContent='⭐ '+score+' pts'; pb.dataset.v=score;
    if(score>old){ pb.classList.remove('pulse'); void pb.offsetWidth; pb.classList.add('pulse'); }
    if(set.size===tWords.length){ sndGood(); confetti(60); st.textContent='Whole paragraph matched! Submitting…';
      setTimeout(()=>submitActiveGame(false),400); }
  }
  // Strict anti-cheat: block paste/drop/right-click, and reject any bulk insert
  // (a jump of many characters at once) that slips past the paste event.
  let lastVal='';
  const warn=()=>{ st.textContent='⛔ No copy-paste — type it yourself!'; st.style.color='var(--red)';
    setTimeout(()=>{st.style.color='';},1500); sndBad(); };
  ta.addEventListener('input',()=>{
    if(ta.value.length-lastVal.length>15){ ta.value=lastVal; warn(); return; }
    lastVal=ta.value; update();
  });
  const block=e=>{ e.preventDefault(); warn(); };
  ta.addEventListener('paste',block);
  ta.addEventListener('drop',block);
  ta.addEventListener('contextmenu',e=>e.preventDefault());
  update();
  submitBtn(box);
  activeGame.finalize=()=>{
    const matched=matchedSet().size;
    const score=Math.round(matched/tWords.length*100);
    return {score, display:`${matched}/${tWords.length} words (${score}%)`};
  };
}
function gameText(box,round){
  box.innerHTML=`<div class="big center" style="letter-spacing:6px;margin:10px 0">${esc(round.puzzle)}</div>
    <input id="ans" placeholder="Your answer" autocomplete="off"/>

}
// 5) Word Scramble — unscramble as many words as you can before time runs out.
function scramble(w,rnd){
  if(w.length<2) return w;
  let a;
  for(let t=0;t<25;t++){ a=w.split('');
    for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    if(a.join('')!==w) break; }
  return a.join('');
}
function gameScramble(box,round){
  const words=(round.words||[]).slice(0,10).map(w=>w.toUpperCase());
  const rnd=mulberry32((G.tStart||1)+3);
  const scrambled=words.map(w=>scramble(w,rnd));
  const N=words.length;
  const solvedSet=new Set();       // indices already locked in
  const typed=new Array(N).fill(''); // remembers in-progress typing per word
  let cur=0;
  box.innerHTML=`
    <div class="row" style="justify-content:space-between">
      <span class="muted" id="sprog"></span><span class="ptsbadge" id="spts" data-v="0">⭐ 0 pts</span></div>
    <div class="big center" id="sword" style="letter-spacing:8px;margin:16px 0"></div>
    <input id="sans" placeholder="Type the word…" autocomplete="off" autocapitalize="characters" spellcheck="false"/>
    <div class="row" style="margin-top:12px">
      <button id="sback" class="ghost">◀ Back</button>
      <button id="scheck" class="ok">✓ Submit answer</button>
      <button id="snext" class="ghost">Next ▶</button>
      <span class="grow"></span><span class="muted" id="smsg"></span></div>`;
  const wEl=$('#sword',box), inp=$('#sans',box), prog=$('#sprog',box), pb=$('#spts',box),
        msg=$('#smsg',box), back=$('#sback',box), next=$('#snext',box), chk=$('#scheck',box);
  function updPts(){ const score=Math.round(solvedSet.size/N*100), old=+pb.dataset.v||0;
    pb.textContent='⭐ '+score+' pts'; pb.dataset.v=score;
    if(score>old){pb.classList.remove('pulse');void pb.offsetWidth;pb.classList.add('pulse');} }
  function save(){ if(!inp.disabled) typed[cur]=inp.value; }
  function paint(){
    updPts();
    if(solvedSet.size>=N){ wEl.textContent='All done! 🎉'; inp.disabled=true;
      back.disabled=next.disabled=chk.disabled=true;
      prog.textContent='solved '+N+' / '+N; msg.textContent='Submitting…';
      setTimeout(()=>submitActiveGame(false),350); return; }
    wEl.textContent=scrambled[cur];
    prog.textContent='Word '+(cur+1)+' / '+N+' · solved '+solvedSet.size;
    back.disabled=(cur===0); next.disabled=(cur===N-1);
    const done=solvedSet.has(cur);
    inp.disabled=done; chk.disabled=done;
    if(done){ inp.value=words[cur]; wEl.classList.add('solved'); chk.textContent='✓ solved'; msg.textContent='✓ solved'; }
    else{ inp.value=typed[cur]||''; wEl.classList.remove('solved'); chk.textContent='✓ Submit answer'; msg.textContent=''; inp.focus(); }
  }
  function check(){
    if(solvedSet.has(cur)) return;
    if(norm(inp.value)===words[cur]){ solvedSet.add(cur); sndGood(); beep(1050,.06);
      if(solvedSet.size>=N){ paint(); return; }
      msg.textContent='✓ correct!'; paint(); }
    else { msg.textContent='Not quite — try again.'; inp.select(); }
  }
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
  chk.onclick=check;
  back.onclick=()=>{ save(); if(cur>0){cur--; paint();} };
  next.onclick=()=>{ save(); if(cur<N-1){cur++; paint();} };
  paint();
  activeGame.finalize=()=>({score:Math.round(solvedSet.size/N*100), display:solvedSet.size+'/'+N+' words'});
}

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; }
// Deterministic per-team riddle assignment (shuffled differently for each team).
function cbAssign(round,t){
  const members=teamMembers(t); const N=Math.max(1,members.length);
  const rnd=mulberry32((Math.floor(G.tStart||1))+hashStr(t.id)*7+3);
  const idx=[...Array(RIDDLES.length).keys()];
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  const chosen=[]; for(let i=0;i<N;i++) chosen.push(RIDDLES[idx[i%idx.length]]);
  return {members, chosen, code:chosen.map(r=>r.a).join(''), N};
}
// How many teammates have entered their CORRECT digit for this round.
function cbCorrectCount(t,r){ const {members}=cbAssign(ROUNDS[r],t);

function runTests(code,fnName,tests){
  let fn;
  try{ fn=new Function(code+'\n;return '+fnName+';')(); }
  catch(e){ return {passed:0,total:tests.length,err:String(e.message),results:[]}; }
  if(typeof fn!=='function') return {passed:0,total:tests.length,err:fnName+' is not defined',results:[]};
  let passed=0; const results=[];
  for(const t of tests){ let got, err=null, pass=false;
    try{ got=fn.apply(null,JSON.parse(JSON.stringify(t.args)));
      pass=JSON.stringify(got)===JSON.stringify(t.expected); }
    catch(e){ err=e.message; }
    if(pass) passed++;
    results.push({args:t.args, expected:t.expected, got, err, pass});
  }
  return {passed,total:tests.length,results};
}

// 2) Maze Runner — fog of war + collect all coins + progressive levels.
function gameMaze(box,round){
  const REVEAL=4;                    // fog radius (grid units)
  let level=0, pts=0, coinsGot=0, cleared=0;
  let grid,start,end,pos,W,H,coins,seen;
  box.innerHTML=`
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="muted" id="ms"></div><div class="ptsbadge" id="mp" data-v="0">⭐ 0 pts</div></div>
    <div class="maze" id="mz"></div>
    <div class="dpad"><span></span><button data-d="up">▲</button><span></span>
      <button data-d="left">◀</button><span></span><button data-d="right">▶</button>
      <span></span><button data-d="down">▼</button><span></span></div>`;
  const mz=$('#mz',box), ms=$('#ms',box), mp=$('#mp',box);

  function spec(l){ return { cols:Math.min((round.cols||10)+l*2,15), rows:Math.min((round.rows||7)+l,10), ncoins:Math.min(3+l,8) }; }
  function loadLevel(){
    const s=spec(level);
    const seed=Math.floor(G.tStart||1)+level*1009+round.id.length;
    const m=genMaze(s.cols,s.rows,seed); grid=m.grid; start=m.start; end=m.end;
    H=grid.length; W=grid[0].length; pos=[start[0],start[1]];
    // Braid the maze: open ~18% of interior walls to add extra paths & loops.
    const brnd=mulberry32(seed+999);
    for(let r=1;r<H-1;r++)for(let c=1;c<W-1;c++)
      if(grid[r][c]===1 && ((r%2===1&&c%2===0)||(r%2===0&&c%2===1)) && brnd()<0.18) grid[r][c]=0;
    // Coins go ONLY on cell-centres (odd,odd) — the cells the player can land on —
    // so every coin is always reachable.
    const rnd=mulberry32(seed+55), paths=[];
    for(let r=1;r<H;r+=2)for(let c=1;c<W;c+=2)
      if(!(r===start[0]&&c===start[1]) && !(r===end[0]&&c===end[1])) paths.push(r+','+c);
    for(let i=paths.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[paths[i],paths[j]]=[paths[j],paths[i]];}
    coins=new Set(paths.slice(0,s.ncoins));
    seen=new Set(); revealNear(); draw();
  }
  function revealNear(){
    for(let dr=-REVEAL;dr<=REVEAL;dr++)for(let dc=-REVEAL;dc<=REVEAL;dc++){
      const r=pos[0]+dr,c=pos[1]+dc; if(r>=0&&r<H&&c>=0&&c<W) seen.add(r+','+c); }
  }
  function draw(){
    mz.style.gridTemplateColumns=`repeat(${W},20px)`; mz.innerHTML='';
    for(let r=0;r<H;r++)for(let c=0;c<W;c++){
      const d=document.createElement('div'); d.className='mcell'; const key=r+','+c;
      if(!seen.has(key)){ d.classList.add('fog'); mz.appendChild(d); continue; }
      if(r===pos[0]&&c===pos[1]) d.classList.add('you');
      else if(coins.has(key)) d.classList.add('coin');
      else if(r===end[0]&&c===end[1]) d.classList.add(coins.size?'elock':'e');
      else if(r===start[0]&&c===start[1]) d.classList.add('s');
      else d.classList.add(grid[r][c]?'w':'p');
      mz.appendChild(d);
    }
    ms.textContent=`Level ${level+1} · coins left: ${coins.size}`;
    const cur=Math.min(100,pts), old=+mp.dataset.v||0;
    mp.textContent='⭐ '+cur+' pts'; mp.dataset.v=cur;
    if(cur>old){ mp.classList.remove('pulse'); void mp.offsetWidth; mp.classList.add('pulse'); }
  }
  function move(dr,dc){
    const wr=pos[0]+dr,wc=pos[1]+dc,nr=pos[0]+dr*2,nc=pos[1]+dc*2;
    if(nr<0||nr>=H||nc<0||nc>=W||grid[wr][wc]===1) return;
    pos=[nr,nc]; beep(520,.04,'square',.05); const key=nr+','+nc;
    if(coins.has(key)){ coins.delete(key); pts+=5; coinsGot++; beep(1200,.07); }
    revealNear();
    if(nr===end[0]&&nc===end[1]){
      if(coins.size===0){ cleared++; pts+=20; confetti(50); sndAward();
        level++; ms.textContent='Level cleared! Loading next…'; setTimeout(loadLevel,450); return; }
      ms.textContent='Locked! Collect every coin first.'; beep(180,.12,'sawtooth');
    }
    draw();
  }
  const keyh=e=>{const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    if(m){e.preventDefault();move(m[0],m[1]);}};
  addEventListener('keydown',keyh);
  box.querySelectorAll('.dpad button').forEach(b=>b.onclick=()=>{
    const m={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]}[b.dataset.d];move(m[0],m[1]);});
  loadLevel();
  activeGame.cleanup=()=>removeEventListener('keydown',keyh);
  activeGame.finalize=()=>({score:clamp(Math.min(100,pts),0,100),
    display:`${cleared} level${cleared===1?'':'s'} cleared, ${coinsGot} coins`});
}

function gameTyping(box,round){
  box.innerHTML=`<div class="card" style="background:var(--bg2)">${esc(round.text)}</div>
    <textarea id="tp" placeholder="Start typing..."></textarea>
    <div class="muted" id="tstat" style="margin-top:6px">WPM 0 · Acc 0%</div>`;
  const ta=$('#tp',box),st=$('#tstat',box);let started=0;
  function stats(){ if(!started&&ta.value)started=serverNow();
    const target=round.text,typed=ta.value;
    let correct=0;for(let i=0;i<typed.length;i++)if(typed[i]===target[i])correct++;
    const acc=typed.length?correct/typed.length:0;
    const mins=started?Math.max((serverNow()-started)/60000,1/60):1/60;
    const wpm=(typed.length/5)/mins;
    st.textContent=`WPM ${Math.round(wpm)} · Acc ${Math.round(acc*100)}%`;return {acc,wpm};}
  ta.addEventListener('input',stats);
  submitBtn(box);
  activeGame.finalize=()=>{const {acc,wpm}=stats();
    return {score:clamp(Math.round(acc*acc*100*clamp(wpm/45,.2,1)),0,100),
      display:`${Math.round(wpm)} WPM, ${Math.round(acc*100)}% acc`};};
}
function gameMemory(box,round){
  const CS=['#ff5470','#ff9f43','#ffd257','#37d67a','#2fd4c9','#4f7cf0','#7c5bff','#e05be0','#ff6b9d'];
  box.innerHTML=`
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="pill" id="mlvl">Level 1</span>
      <span class="ptsbadge" id="mpts" data-v="0">⭐ 0 pts</span></div>
    <div class="center" id="mstat" style="margin:10px 0;font-weight:700;min-height:22px">Get ready…</div>
    <div class="mtiles watch" id="tiles">${CS.map((c,i)=>`<div class="mtile" data-i="${i}" style="background:${c};color:${c}"></div>`).join('')}</div>
    <div class="center" id="mdots" style="margin-top:10px;letter-spacing:5px;color:var(--muted)"></div>`;
  const tilesEl=box.querySelectorAll('.mtile'),st=$('#mstat',box),grid=$('#tiles',box),
        lvl=$('#mlvl',box),pts=$('#mpts',box),dots=$('#mdots',box);
  // Size the 3x3 grid to the space actually left below the header, so all nine
  // tiles are always fully in view (never off-screen) on any phone.
  function fitGrid(){ const top=grid.getBoundingClientRect().top;
    const avail=window.innerHeight-top-50;                 // leave room for the progress dots
    const size=Math.round(Math.max(170,Math.min(320,window.innerWidth*0.82,avail)));
    grid.style.width=size+'px'; }
  fitGrid(); window.addEventListener('resize',fitGrid);
  activeGame.cleanup=()=>window.removeEventListener('resize',fitGrid);
  let seq=[],input=[],level=0,accepting=false,best=0;
  const rnd=()=>Math.floor(Math.random()*9);
  function setPts(){ const s=clamp(level*12,0,100),old=+pts.dataset.v||0; pts.dataset.v=s;
    pts.textContent='⭐ '+s+' pts'; if(s>old){pts.classList.remove('pulse');void pts.offsetWidth;pts.classList.add('pulse');} }
  function drawDots(){ dots.textContent=seq.map((_,i)=>i<input.length?'●':'○').join(' '); }
  function light(i,ms=430){ return new Promise(r=>{ tilesEl[i].classList.add('on'); beep(320+i*55,.16);
    setTimeout(()=>{ tilesEl[i].classList.remove('on'); setTimeout(r,150); },ms); }); }
  async function play(){ accepting=false; grid.classList.add('watch');
    st.textContent='👀 Watch the pattern…'; input=[]; drawDots();
    await new Promise(r=>setTimeout(r,500));
    for(const i of seq) await light(i);
    accepting=true; grid.classList.remove('watch'); st.textContent='🫵 Your turn — repeat it!'; }
  function next(){ level++; best=level-1; lvl.textContent='Level '+level; setPts(); seq.push(rnd()); play(); }
  tilesEl.forEach(t=>t.onclick=()=>{ if(!accepting)return; const i=+t.dataset.i;
    tilesEl[i].classList.add('on'); beep(320+i*55,.12); setTimeout(()=>tilesEl[i].classList.remove('on'),160);
    input.push(i); drawDots(); const k=input.length-1;
    if(input[k]!==seq[k]){ accepting=false; best=level-1; sndBad(); grid.classList.add('watch');
      st.innerHTML='❌ Wrong! Reached <b>level '+best+'</b> — submitting…'; setTimeout(()=>submitActiveGame(false),750); return; }
    if(input.length===seq.length){ accepting=false; best=level;
      st.innerHTML='✅ Level '+level+' cleared!'; setTimeout(next,800); } });
  // "Get ready" countdown so players are prepared before the first pattern plays.
  function countdown(n){
    if(n>0){ st.innerHTML='Get ready… <b style="font-size:30px;color:var(--accent)">'+n+'</b>';
      setTimeout(()=>countdown(n-1),900); }
    else { st.innerHTML='<b style="font-size:26px;color:var(--green)">Go! 👀</b>'; setTimeout(next,600); }
  }
  countdown(5);
  activeGame.finalize=()=>({score:clamp(best*12,0,100),display:'reached level '+best});
}
function gameReaction(box,round){
  box.innerHTML=`<div class="reactbox" id="rb" style="background:var(--red)">Wait…</div>
    <div class="muted center" id="rstat" style="margin-top:8px">Attempt 1 of 3</div>`;
  const rb=$('#rb',box),st=$('#rstat',box);
  let attempt=0,times=[],green=false,greenAt=0,tmo=null,done=false;
  function arm(){green=false;rb.style.background='var(--red)';rb.textContent='Wait for GREEN…';
    tmo=setTimeout(()=>{green=true;greenAt=performance.now();rb.style.background='var(--green)';rb.textContent='TAP!';},900+Math.random()*2200);}
  rb.onclick=()=>{ if(done)return;
    if(!green){ if(tmo)clearTimeout(tmo);rb.textContent='Too soon! resetting…';beep(160,.15,'sawtooth');setTimeout(arm,700);return;}
    const ms=Math.round(performance.now()-greenAt);times.push(ms);attempt++;beep(880,.08);
    if(attempt>=3){done=true;const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
      rb.style.background='var(--panel2)';rb.textContent='Avg '+avg+'ms';
      st.textContent='Done! '+times.join('ms, ')+'ms';setTimeout(()=>submitActiveGame(false),500);}
    else{st.textContent='Attempt '+(attempt+1)+' of 3 · last '+ms+'ms';arm();}};
  arm();
  activeGame.finalize=()=>{ if(!times.length) return {score:0,display:'no taps'};
    const avg=times.reduce((a,b)=>a+b,0)/times.length;
    return {score:clamp(Math.round(100-(avg-180)/6),0,100),display:Math.round(avg)+'ms avg'};};
}

// 13) Logo Guess — TEAM game: all logos, one every LOGO_PER sec (auto-advancing,
// synced), anyone on the team spells it to lock it. Max 2 hints per player.
const LOGO_PER=30;            // seconds each logo is shown
let logoHints=0;              // per-player hint uses this round
function logoOrder(round){ const pool=round.logos||[]; const rnd=mulberry32((G.tStart||1)+9);
  const idx=[...pool.keys()]; for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.map(i=>pool[i]); }
function logoCurrent(round){ const total=(round.logos||[]).length;
  if(!G.tStart||G.phase!=='playing') return 0;
  return clamp(Math.floor((serverNow()-G.tStart)/(LOGO_PER*1000)),0,total-1); }
function logoSecLeft(){ if(!G.tStart) return LOGO_PER;
  const e=(serverNow()-G.tStart)/1000; return clamp(LOGO_PER-Math.floor(e%LOGO_PER),0,LOGO_PER); }
function logoSolvedCount(round,teamId,r){ let n=0; for(let i=0;i<(round.logos||[]).length;i++) if(STORE['lg:'+r+':'+teamId+':'+i]) n++; return n; }
function gameLogoGuess(box,round){
  const t=teamOf(MY.pid); activeGame.submitted=true; activeGame.finalize=()=>({});
  if(!t){ box.innerHTML='<p class="muted">Waiting to be put on a team…</p>'; return; }
  logoHints=0;
  box.innerHTML='<div id="lgwrap"></div>';
  renderLogoGuess();
}
function renderLogoGuess(){
  const wrap=document.getElementById('lgwrap'); if(!wrap) return;
  const r=G.roundIndex, round=ROUNDS[r], t=teamOf(MY.pid); if(!t) return;
  const list=logoOrder(round), total=list.length, cur=logoCurrent(round);
  const L=list[cur], answer=L.answer.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const solved=STORE['lg:'+r+':'+t.id+':'+cur];
  const solvedCount=logoSolvedCount(round,t.id,r);
  const score=Math.round(solvedCount/total*(round.max||100));
  wrap.dataset.cur=cur; wrap.dataset.sig=cur+'|'+(solved?1:0);
  wrap.innerHTML=`
    <div class="row" style="justify-content:space-between">
      <span class="muted">Logo ${cur+1} / ${total} · ${solvedCount} solved</span>
      <span class="ptsbadge">⏱ <span id="lgtime">${logoSecLeft()}</span>s · ⭐ ${score} pts</span></div>
    <div class="lgstage"><img id="lgimg" src="${esc(L.img)}" alt="logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
      <div class="lgmiss" style="display:none">Logo image not found — place it in <b>public/logos/</b></div>
      <div class="lgq">What logo is this?</div></div>
    ${solved
      ? `<div class="center" style="margin:14px 0"><span class="pill live">✓ ${esc(answer)} — solved by ${esc(solved.by)}</span></div>`
      : `<div class="center" style="margin:10px 0">
           <button class="ghost" id="lghint"${logoHints>=2?' disabled':''}>💡 Hint (${Math.max(0,2-logoHints)} left)</button>
           <span class="muted" id="lgmsg" style="margin-left:8px"></span></div>
         <div class="lgslots" id="lgslots"></div>
         <div class="lgbank" id="lgbank"></div>`}`;
  if(solved) return;
  // local tile board for the current logo (stable within the 20s window)
  let slots=answer.split('').map(()=>null);
  const brnd=mulberry32((G.tStart||1)+cur*131+7), DEC='ABCDEFGHIJKLMNOPQRSTUVWXYZ', letters=answer.split('');
  const decoy=clamp(13-answer.length,3,8);
  for(let i=0;i<decoy;i++) letters.push(DEC[Math.floor(brnd()*26)]);
  for(let i=letters.length-1;i>0;i--){const j=Math.floor(brnd()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]];}
  let tiles=letters.map((ch,i)=>({id:i,letter:ch,used:false}));
  const slotsEl=wrap.querySelector('#lgslots'), bankEl=wrap.querySelector('#lgbank'), msg=wrap.querySelector('#lgmsg'), hintBtn=wrap.querySelector('#lghint');
  function draw(){
    slotsEl.innerHTML=slots.map(s=>`<div class="lgslot${s?' filled':''}">${s?esc(s.letter):''}</div>`).join('');
    bankEl.innerHTML=tiles.map(x=>`<button class="lgtile" data-id="${x.id}"${x.used?' disabled':''}>${esc(x.letter)}</button>`).join('')
      +`<button class="lgtile lgback" id="lgbk">⌫</button>`;
    bankEl.querySelectorAll('.lgtile[data-id]').forEach(b=>b.onclick=()=>fill(+b.dataset.id));
    bankEl.querySelector('#lgbk').onclick=back;
  }
  function fill(id){ const x=tiles[id]; if(!x||x.used) return; const k=slots.findIndex(s=>!s); if(k<0) return;
    slots[k]={letter:x.letter,tileId:id}; x.used=true; beep(600,.04,'square',.05); draw();
    if(slots.every(Boolean)) check(); }
  function back(){ for(let k=slots.length-1;k>=0;k--){ if(slots[k]){ const id=slots[k].tileId; if(id!=null&&tiles[id])tiles[id].used=false; slots[k]=null; draw(); return; } } }
  async function check(){
    if(STORE['lg:'+r+':'+t.id+':'+cur] || logoCurrent(round)!==cur) return;   // teammate solved, or window passed
    if(slots.map(s=>s.letter).join('')===answer){ sndGood(); confetti(30);
      await apiSet('lg:'+r+':'+t.id+':'+cur,{by:MY.name, ts:serverNow()}); await poll(); }
    else { sndBad(); slotsEl.classList.add('shake'); msg.innerHTML='<span style="color:var(--red)">✗ Not quite</span>';
      setTimeout(()=>{ slotsEl.classList.remove('shake'); slots=slots.map(()=>null); tiles.forEach(x=>x.used=false); msg.textContent=''; draw(); },600); } }
  if(hintBtn) hintBtn.onclick=()=>{ if(logoHints>=2) return; const k=slots.findIndex(s=>!s); if(k<0) return;
    const x=tiles.find(z=>!z.used&&z.letter===answer[k]); if(x){ logoHints++; fill(x.id);
      hintBtn.textContent='💡 Hint ('+Math.max(0,2-logoHints)+' left)'; if(logoHints>=2) hintBtn.disabled=true; } };
  draw();
}
function refreshLogoGuess(){ const wrap=document.getElementById('lgwrap'); if(!wrap) return;
  const t=teamOf(MY.pid); if(!t) return; const r=G.roundIndex, round=ROUNDS[r];
  const cur=logoCurrent(round); const sig=cur+'|'+(STORE['lg:'+r+':'+t.id+':'+cur]?1:0);
  if(wrap.dataset.sig!==sig) renderLogoGuess(); }
function logoTick(){ const wrap=document.getElementById('lgwrap'); if(!wrap) return;

  const el=document.getElementById('lgtime'); if(el) el.textContent=logoSecLeft(); }

      return `<div>${ok?'✓':'✗'} ${esc(q.q)}${q.code?` <code>${esc(q.code.replace(/\n/g,' '))}</code>`:''} → <b>${esc(q.options[q.answerIndex])}</b>`+
        (a&&!ok?` <span class="muted">(you: ${esc(q.options[a.choice]!=null?q.options[a.choice]:'—')})</span>`:'')+`</div>`; }).join('');
    correctHTML=`Your team got <b>${correct}/${qs.length}</b> right.<div class="muted" style="margin-top:8px;font-size:12px;line-height:1.7">${rows}</div>`; }
  else if(round.type==='emoji'){ const pz=round.puzzles||[]; let c=0;
    const rows=pz.map((p,i)=>{ const a=t?STORE['em:'+G.roundIndex+':'+t.id+':'+i]:null; const ok=emCorrect(p,a); if(ok)c++;

  else if(round.type==='javafill') correctHTML=`The condition was <code>${esc(round.answer)}</code>.<pre class="code" style="margin-top:6px">${esc((round.code||'').replace('/* ??? */',round.answer))}</pre>`;

      <button class="x" data-pid="${esc(p.pid)}" title="remove">✕</button></div>`).join('')
    : '<p class="muted">No one has joined yet. Share the link!</p>';
  if(g) g.querySelectorAll('.x').forEach(b=>b.onclick=async()=>{ await apiDel('player:'+b.dataset.pid); poll(); });
  // team preview (host only)
  const tp=$('#teampreview'); const teams=teamsMeta();
  if(tp) tp.innerHTML = teams.length? '<div class="card"><h3>Team preview</h3>'+teams.map(t=>{
      const m=teamMembers(t);
      return `<div class="teamcard"><h3><span class="dot" style="background:${esc(t.color)}"></span>${esc(t.name)}
        <span class="muted" style="font-weight:400;font-size:13px">· ${m.length} members</span></h3>
        <div class="members">${m.map(p=>`<span class="memchip">${avatarHTML(p,'sm')}${esc(p.name)}</span>`).join('')}</div></div>`;
    }).join('')+'</div>' : '';
}

async function buildTeams(){
  const ppl=allPlayers();
  if(ppl.length<2){ alert('Need at least 2 players to build teams.'); return; }
  const shuffled=[...ppl].sort(()=>Math.random()-0.5);
  const k=clamp(Math.round(ppl.length/teamTarget),1,TEAM_POOL.length);
  const pool=[...TEAM_POOL].sort(()=>Math.random()-0.5).slice(0,k);
  const teams=pool.map((meta,i)=>({id:'t'+i,name:meta.name,color:meta.color,pids:[]}));
  shuffled.forEach((p,i)=>teams[i%k].pids.push(p.pid)); // round-robin => balanced
  await apiSet('teams',teams);
  beep(700,.12); confetti(60); poll();
}

// Fold players who joined after the game started into the smallest team.
// Idempotent: dedupes pids, drops removed players, adds each newcomer once,
// and only writes when something actually changed (avoids poll races).
async function reconcileLateJoiners(){
  const teams=teamsMeta(); if(!teams.length) return;
  const valid=new Set(allPlayers().map(p=>p.pid));
  const seen=new Set();
  const copy=teams.map(t=>({...t,pids:(t.pids||[]).filter(pid=>{
    if(!valid.has(pid)||seen.has(pid)) return false; seen.add(pid); return true; })}));
  const late=allPlayers().filter(p=>!seen.has(p.pid));
  for(const p of late){ copy.sort((a,b)=>a.pids.length-b.pids.length); copy[0].pids.push(p.pid); seen.add(p.pid); }
  if(JSON.stringify(copy)!==JSON.stringify(teams)) await apiSet('teams',copy);
}

// Clear every score/submission. Uses the fast server endpoint, and falls back to
// per-key deletes if the server hasn't been relaunched with that endpoint yet.
function clearScores(){ wsSend({t:'clearScores'}); return Promise.resolve(); }
// Restart just the CURRENT round: clear this round's scores/submissions and put
// it back to the ready state so the host can start it again.
async function restartRound(){
  const i=G.roundIndex;
  if(!confirm('Restart round '+(i+1)+' ("'+ROUNDS[i].title+'")? This round\'s scores are cleared so teams can play it again.')) return;
  const keys=Object.keys(STORE).filter(k=>
    k.startsWith('pscore:'+i+':')||k.startsWith('panswer:'+i+':')||k.startsWith('tscore:'+i+':')||
    k.startsWith('bs:'+i+':')||k.startsWith('rq:'+i+':')||k.startsWith('cb:'+i+':')||k.startsWith('em:'+i+':')||k.startsWith('lg:'+i+':'));
  await Promise.all(keys.map(k=>apiDel(k)));
  await apiSet('game',{stage:'game',roundIndex:i,phase:'lobby',tStart:0,duration:0});
  beep(660,.1);setTimeout(()=>beep(880,.12),90); poll();
}

// Restart the WHOLE game: clear ALL scores, keep the same players/teams, back to round 1.
async function restartGame(){
  if(!confirm('Restart the WHOLE game? Every round\'s scores are cleared and the SAME teams play again from round 1.')) return;
  await clearScores();
  await apiSet('game',{stage:'game',roundIndex:0,phase:'lobby',tStart:0,duration:0});
  beep(660,.1);setTimeout(()=>beep(990,.15),100); confetti(60); poll();
}

function refreshHostGameList(){
  const wrap=$('#teamlist'); if(!wrap) return;
  const ae=document.activeElement;
  if(ae && ae.classList && ae.classList.contains('scinp')) return;
  const teams=teamsMeta(); const r=G.roundIndex;
  if(!teams.length){ wrap.innerHTML='<p class="muted">No teams.</p>'; return; }
  wrap.innerHTML=teams.map(t=>{
    const m=teamMembers(t);
    const rows=m.map(p=>{
      const a=STORE['panswer:'+r+':'+p.pid]; const sc=STORE['pscore:'+r+':'+p.pid];
      const txt=a?esc(a.display||'(submitted)'):'<span class="muted">—</span>';
      const pts=typeof sc==='number'?`<b>${sc}</b>`:'';
      return `<div class="row" style="gap:8px;font-size:13px;margin:2px 0">
        ${avatarHTML(p,'sm')}<span style="min-width:90px">${esc(p.name)}</span>
        <span class="grow" style="opacity:.9">${txt}</span>${pts}</div>`;
    }).join('');
    const ov=STORE['tscore:'+r+':'+t.id]; const cur=typeof ov==='number'?ov:'';
    return `<div class="teamcard">
      <h3><span class="dot" style="background:${esc(t.color)}"></span>${esc(t.name)}
        <span class="grow"></span>
        <span class="pill">round ${teamRoundScore(t,r)} · total ${teamTotal(t)}</span></h3>
      ${rows||'<span class="muted">no members</span>'}
      <div class="row" style="gap:6px;margin-top:8px">
        <span class="muted" style="font-size:12px">Override team round score:</span>
        <input type="number" class="scinp" data-t="${t.id}" value="${cur}" placeholder="avg" style="width:80px"/>
        <button class="setpts" data-t="${t.id}">Set</button>
        <button class="ghost clearpts" data-t="${t.id}">Auto</button>
      </div></div>`;
  }).join('');
  wrap.querySelectorAll('.setpts').forEach(b=>b.onclick=()=>{
    const inp=wrap.querySelector('.scinp[data-t="'+b.dataset.t+'"]');
    setTeamOverride(b.dataset.t, parseInt(inp.value,10)||0);});
  wrap.querySelectorAll('.clearpts').forEach(b=>b.onclick=()=>clearTeamOverride(b.dataset.t));
}

// ---- Host logo admin -------------------------------------------------------
function wireLogoAdmin(){
  const add=$('#lgadd'); if(!add) return;
  add.onclick=async()=>{
    const f=$('#lgfile'),a=$('#lgans'),st=$('#lgstatus');
    if(!f.files||!f.files[0]){ st.textContent='Pick an image first.'; return; }
    if(!a.value.trim()){ st.textContent='Enter the brand/answer.'; return; }
    add.disabled=true; st.textContent='Uploading…';
    try{ const dataUrl=await fileToDataUrl(f.files[0]); const up=await apiUpload(f.files[0].name,dataUrl);
      if(!up.url) throw new Error(up.error||'upload failed');
      const set=logoSet().concat([{url:up.url,answer:a.value.trim()}]);
      await apiSet('config:logoset',set); f.value='';a.value='';st.textContent='Added ✓';beep(700,.1); await poll();
    }catch(e){ st.textContent='Error: '+e.message; } add.disabled=false; };
}
function refreshLogoList(){
  const ul=$('#logolist'); if(!ul) return; const set=logoSet();
  ul.innerHTML=set.length? set.map((it,i)=>`<li><img src="${esc(it.url)}"/><b>${esc(it.answer)}</b>
    <button class="warn lgdel" data-i="${i}" style="margin-left:auto;padding:4px 10px">Remove</button></li>`).join('')
    : '<li class="muted">No logos added yet.</li>';
  ul.querySelectorAll('.lgdel').forEach(b=>b.onclick=async()=>{
    const set=logoSet().filter((_,i)=>i!==+b.dataset.i); await apiSet('config:logoset',set); await poll();});
}

// ============================================================================
//  CASUAL INSPECT DETERRENTS
//  Note: these only stop casual peeking — no web page can truly block DevTools.
//  The real protection is that the passcode is server-side, so there is nothing
//  sensitive to find in this page anyway.
// ============================================================================
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('keydown', e=>{
  const k=(e.key||'').toLowerCase();
  if(e.key==='F12') { e.preventDefault(); return; }                       // devtools
  if(e.ctrlKey && k==='u') { e.preventDefault(); return; }                // view-source
  if((e.ctrlKey||e.metaKey) && e.shiftKey && ['i','j','c'].includes(k)) e.preventDefault(); // devtools
});
// Site-wide anti-cheat: block copy / cut / paste everywhere (Ctrl+C/X/V,
// right-click, and the edit menu all fire these events).
['copy','cut','paste'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault()));

// ============================================================================
//  BOOT
// ============================================================================
(async function(){
  await syncClock(); setInterval(syncClock,30000);
  // Resume the session on refresh instead of dumping the user back to the landing page.
  const role=localStorage.getItem('dra_role');
  if(role==='player' && MY && MY.pid) startPlayer();
  // Host: connect and identify over WS. If the token is stale (server restarted),
  // the server replies 'denied' and we drop to the passcode gate automatically.
  else if(role==='host') startHost();
  else routeLanding();
})();
</script>
